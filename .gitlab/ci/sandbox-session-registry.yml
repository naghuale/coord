sandbox-session-registry:
  stage: verify
  image: debian:bookworm-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends python3 python3-yaml bubblewrap
  script:
    - make check
    - bwrap --version
  rules:
    - changes:
        - scripts/**
        - config/**
        - tests/**
        - docs/SECURITY-BOUNDARY.md
        - .gitlab/ci/sandbox-session-registry.yml
    - when: never
