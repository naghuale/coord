recovery:static:
  stage: verify
  image: python:3.12-slim
  before_script:
    - python -m pip install --disable-pip-version-check --no-cache-dir PyYAML jsonschema
  script:
    - tests/test_recovery_checks.sh
    - |
      python3 scripts/check-recovery-governance.py \
        --registry docs/DOCUMENT-REGISTRY.yaml \
        --action-map docs/operations/ACTION-MAP.yaml \
        --agents AGENTS.md \
        --regulation-path docs/operations/AGENT-SESSION-RECOVERY-REGULATION.md
  rules:
    - changes:
        - AGENTS.md
        - docs/DOCUMENT-REGISTRY.yaml
        - docs/operations/ACTION-MAP.yaml
        - docs/operations/AGENT-SESSION-RECOVERY-REGULATION.md
        - docs/templates/RECOVERY-REPORT-TEMPLATE.yaml
        - docs/schemas/recovery-report.schema.json
        - scripts/check-recovery-report.py
        - scripts/check-recovery-governance.py
        - tests/fixtures/**
        - tests/test_recovery_checks.sh
        - .gitlab/ci/recovery.yml
    - when: never

recovery:report:
  stage: verify
  image: python:3.12-slim
  before_script:
    - python -m pip install --disable-pip-version-check --no-cache-dir PyYAML jsonschema
  script:
    - |
      test -n "${RECOVERY_REPORT_PATH:-}" || {
        echo "RECOVERY_REPORT_PATH is unset; job not applicable"
        exit 0
      }
    - |
      python3 scripts/check-recovery-report.py \
        "$RECOVERY_REPORT_PATH" \
        --schema docs/schemas/recovery-report.schema.json \
        --project-root "$CI_PROJECT_DIR" \
        --strict-source-files
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - "$RECOVERY_REPORT_PATH"
  rules:
    - if: '$RECOVERY_REPORT_PATH'
    - when: never
