name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  migrated-harnesses:
    name: Go migrated harnesses (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify migrated targets without Python
        shell: bash
        run: |
          set -euo pipefail
          # Deny interpreters that hosted runners may provide implicitly.
          guard_dir="$GITHUB_WORKSPACE/.scratch/tmp/no-python"
          mkdir -p "$guard_dir"
          for tool in python python3 pip pip3 pytest; do
            printf '#!/bin/sh\necho "Python dependency in migrated harness: $0" >&2\nexit 97\n' > "$guard_dir/$tool"
            chmod +x "$guard_dir/$tool"
          done
          PATH="$guard_dir:$PATH" make check-migrated-harnesses

  check:
    name: make check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Recovery and architecture checks remain separate accepted contours.
      # GO-TEST-HARNESS-RETIREMENT-R1 does not retire their dependencies.
      - name: Install recovery and architecture check dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema
      - name: Fetch ops/coord/project for document registry CI_STRICT
        run: git fetch --no-tags origin refs/heads/ops/coord/project:refs/remotes/origin/ops/coord/project
      - name: Document registry CI_STRICT evidence
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/coord-registry-evidence.json"
          go run ./cmd/coord-governance check-document-registry \
            --registry docs/DOCUMENT-REGISTRY.yaml \
            --root . \
            --mode CI_STRICT \
            --evidence "$evidence"
      - name: Upload registry evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coord-registry-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/coord-registry-evidence.json
          if-no-files-found: ignore
      - run: make check
