name: architecture-sync

on:
  pull_request:
  push:
    branches:
      - main
      - p0-2-task

permissions:
  contents: read

jobs:
  architecture-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install checker dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Validate architecture registry and documents
        run: python scripts/check-architecture-sync

      - name: Run architecture checker self-tests
        run: python scripts/check-architecture-sync-test
