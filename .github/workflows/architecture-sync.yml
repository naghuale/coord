name: architecture-sync

on:
  pull_request:
  push:
    branches:
      - main
      - p0-2-task

permissions:
  contents: read

jobs:
  architecture-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go architecture sync (blocking)
        run: |
          go run ./cmd/coord-governance check-architecture-sync --root . --registry docs/architecture/COMPONENT-STATUS.yaml --document-registry docs/DOCUMENT-REGISTRY.yaml
          go test -count=1 ./internal/architecturecheck/

      - name: Set up Python (evidence only)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install checker dependency (evidence only)
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Python architecture checker evidence (non-blocking log)
        continue-on-error: true
        run: |
          python scripts/check-architecture-sync || true
          python scripts/check-architecture-sync-test || true
