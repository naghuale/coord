apiVersion: coord.dev/v1alpha1
kind: SeccompProfiles
profiles:
  python-agent-v1:
    defaultAction: ERRNO
    errno: 1
    noNewPrivileges: true
    allow:
      - access
      - arch_prctl
      - brk
      - chdir
      - clock_gettime
      - clone
      - clone3
      - close
      - close_range
      - dup
      - dup2
      - dup3
      - epoll_create1
      - epoll_ctl
      - epoll_pwait
      - epoll_wait
      - eventfd2
      - execve
      - exit
      - exit_group
      - faccessat2
      - fcntl
      - fstat
      - fstatfs
      - fsync
      - futex
      - getcwd
      - getdents64
      - getegid
      - geteuid
      - getgid
      - getpeername
      - getpid
      - getppid
      - getrandom
      - getrlimit
      - getsockname
      - getsockopt
      - gettid
      - getuid
      - ioctl
      - lseek
      - madvise
      - mmap
      - mprotect
      - mremap
      - munmap
      - newfstatat
      - openat
      - pipe2
      - poll
      - ppoll
      - prctl
      - pread64
      - prlimit64
      - pselect6
      - read
      - readlink
      - readlinkat
      - recvfrom
      - recvmsg
      - restart_syscall
      - rseq
      - rt_sigaction
      - rt_sigprocmask
      - rt_sigreturn
      - sched_getaffinity
      - sendmsg
      - sendto
      - set_robust_list
      - set_tid_address
      - sigaltstack
      - socket
      - socketpair
      - statx
      - sysinfo
      - tgkill
      - uname
      - wait4
      - waitid
      - write
      - writev
    denyExplicit:
      - bpf
      - kexec_load
      - keyctl
      - mount
      - open_by_handle_at
      - perf_event_open
      - pivot_root
      - ptrace
      - reboot
      - setns
      - swapon
      - swapoff
      - umount2
      - unshare
      - userfaultfd
