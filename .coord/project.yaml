apiVersion: coord.dev/v1alpha1
kind: ProjectIdentity

metadata:
  projectId: coord
  displayName: Coord

repository:
  canonicalUrl: https://github.com/naghuale/coord.git
  mainBranch: main
  integrationBranch: p0-2-task

operations:
  prefix: ops/coord
  branches:
    project: ops/coord/project
    coordinator: ops/coord/coordinator
    executor: ops/coord/executor
    reviewer: ops/coord/reviewer
    auditor: ops/coord/auditor
  ledger: docs/operations/OPERATIONS-LEDGER.md

workspacePolicy:
  allAgentsLaunchFromGlobalRoot: true
  sessionCwdVariable: COORD_GLOBAL_ROOT
  projectFilesStayUnderProjectRoot: true
  worktreesStayUnderProjectRoot: true
  tasksStayUnderProjectRoot: true
  systemTmp: deny
  note: >
    Policy is platform-agnostic. The globalRoot path is machine-specific
    and set via the COORD_GLOBAL_ROOT environment variable — never stored
    in this file. ProjectID + canonicalUrl + Git object identity define
    the project; workspace-NN is a local placement binding.

contextModel:
  layers:
    - layer: 1
      name: permanentCore
      always: true
      files:
        - .coord/project.yaml
        - AGENTS.md
        - .coord/CONTEXT-INDEX.yaml
    - layer: 2
      name: currentProjectContext
      always: true
      files:
        - ops/coord/project/operations/project/CURRENT.yaml
        - ops/coord/project/operations/project/OPEN-WORK.yaml
        - ops/coord/project/operations/context/current.yaml
    - layer: 3
      name: currentTaskContext
      loadOnDemand: true
      files:
        - ops/coord/project/operations/assignments/issue-<N>.yaml
        - ops/coord/coordinator/operations/assignments/<taskId>/assignment.yaml
    - layer: 4
      name: archive
      loadOnDemand: true
      note: "Load only on explicit recovery or cross-reference request"
  index: .coord/CONTEXT-INDEX.yaml
  compactionRule: >
    If information is not needed for the next safe action and is
    accessible via a stable reference, it does not remain in the active context.

documents:
  agents: AGENTS.md
  roadmap: docs/ROADMAP.md
  taskModel: docs/TASK-MODEL.md
  targetArchitecture: docs/TARGET-ARCHITECTURE.md
  changelog: CHANGELOG.md
  decisions: docs/decisions/
