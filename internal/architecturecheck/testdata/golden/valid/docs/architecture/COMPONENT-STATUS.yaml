  statusVocabulary: [implemented, partial, missing, proposed, legacy]
documents:
  currentArchitecture: docs/ARCHITECTURE.md
  targetArchitecture: docs/TARGET-ARCHITECTURE.md
architectureSignificantPaths: []
components:
