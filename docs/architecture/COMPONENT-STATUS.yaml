      - docs/plans/p0-2-task/AGENT-COMMAND-BOUNDARY.md
    implemented:
      - authenticated frame signature and local-recipient verification
      - current AgentSession generation and key verification
      - trusted AgentID resolved from AgentSession rather than command body
      - Task, Run, Fence, Attempt, role and Stage checks
      - replay and ExpectedRevision checks
      - atomic transition, DomainEvent, Inbox receipt and Outbox commit
      - rejection paths avoid durable side effects
    missing:
      - production CLI caller
      - production Telepathy caller
      - OwnerCredential
      - command-boundary AgentSession management operations
      - Executor RESULT production path
    evidence:
      symbols:
        - AuthenticatedFrame
        - ApplyAgentCommand
      tests:
        - TestAgentCommandCommitsEventReceiptOutboxAtomically
        - TestAgentCommandIgnoresActorIDFromBody
        - TestAgentCommandRejectsWhitespaceAgentIDWithoutWriting
