apiVersion: coord.dev/v1alpha1
kind: ArchitectureComponentRegistry

metadata:
  projectId: coord
  registryVersion: 1
  updatedFromCommit: <integration-head-sha>
  statusVocabulary:
    - implemented
    - partial
    - missing
    - proposed
    - legacy

documents:
  currentArchitecture: docs/ARCHITECTURE.md
  targetArchitecture: docs/TARGET-ARCHITECTURE.md

architectureSignificantPaths:
  - store/**
  - task/**
  - agentsession/**
  - transport/**
  - checkpoint/**
  - cmd/coordd/**
  - internal/taskservice/**

components:
  - id: canonical-persistence
    title: Canonical persistence
    status: partial
    normativeSources:
      - docs/ADR-0005-STORAGE-MODEL.md
    implemented:
      - CanonicalState persisted as one versioned document
      - Task, Run, DomainEvent, Inbox, Outbox, AgentSession and AgentSessionEvent are part of the durable unit
      - ReviewResult, AuditResult and Discussion Graph data validated as part of canonical state
      - atomic replacement uses temporary file, fsync, rename and parent-directory sync
      - in-memory state published only after successful Save
      - production coordd opens CanonicalStore backed by CanonicalFile
    missing:
      - production command paths for all canonical writers
      - removal of remaining legacy runtime state owners
      - full stage scheduler integration
    evidence:
      symbols:
        - CanonicalState
        - CanonicalPersistence
        - CanonicalFile
        - UpdateCanonical
      tests:
        - TestCanonicalStoreRejectsTaskMutationWithoutEvent
        - TestCanonicalFileReadsAndRewritesCreationOnlyV1WithoutFenceField
      issues:
        - 5
    documents:
      currentAnchor: canonical-persistence
      targetAnchor: canonical-persistence

  - id: canonical-command-boundary
