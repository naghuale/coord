    status: IMPLEMENTED_AS_CONTRACT
  mrAndNightlyProfiles:
    status: IMPLEMENTED
  contextBudgets:
    status: IMPLEMENTED_AS_INITIAL_POLICY
    note: token limits require adapter measurement and burn-in recalibration
  rawResultRetention:
    status: IMPLEMENTED
  hiddenCases:
    status: PARTIAL
    blockedBy:
      - protected external hidden-case source
  evaluationCost:
    status: IMPLEMENTED_AS_MODEL
    blockedBy:
      - provider prices
      - runner price
      - actual token telemetry
  actionContextSchema:
    status: IMPLEMENTED
  evidenceRecordSchema:
    status: IMPLEMENTED
  externalImmutableStore:
    status: NOT_REQUIRED_FOR_INITIAL_ADOPTION
