review:
  class: R
  requirements:
    - implementation in AGENTS.md and Coordinator State Machine (Workstream B scope)
    - independent Reviewer (not Executor codex:workspace-c19)
    - independent Auditor (TD-R2, not Executor or Reviewer)
    - process contract tests (DELIVERED != ADMITTED etc.)
    - session state inspection scenarios
    - mutation regression

rollback: >
  Remove R146 section from AGENTS.md and Coordinator State Machine.
  Set stageAllowed=false and commitAllowed=false for Workstream B.
  Delete docs/decisions/ACTIVE-COORDINATOR-DISPATCH-R146.yaml.
  Revert issue #47 status to FROZEN_PENDING_TRACKING.
  All prior subjects under issue #44 remain valid.
