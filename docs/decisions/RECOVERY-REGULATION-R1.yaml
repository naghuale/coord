decision: RECOVERY-REGULATION-R1
class: R
issue: 44
status: accepted
authority: AGENTS.md
norms:
  - AGENTS.md-sources-of-truth
  - R143

decisionDate: "2026-10-13"

decisionProvenance: >
  OWNER confirmed RECOVERY-REGULATION-R1 in the coordinator conversation
  on 2026-10-13. The accepted decision selects option A: the Agent Session
  Recovery Regulation is Accepted, has normativeAuthority=true, and remains
  subject to mandatory CI enforcement. GitHub issue https://github.com/naghuale/coord/issues/44
  is the durable project record associated with the decision.

provenanceRefs:
  - kind: github-issue
    value: "https://github.com/naghuale/coord/issues/44"
  - kind: owner-decision
    value: RECOVERY-REGULATION-R1

context: >
  docs/operations/AGENT-SESSION-RECOVERY-REGULATION.md was registered as
  status=proposed, normativeAuthority=false. AGENTS.md §Workspace Root and
  ACTION-MAP already directed resumed sessions to RECOVER_SESSION, and CI
  enforced presence of recovery transitions in AGENTS.md. The regulation was
  necessary as a mandatory fail-closed process, not a recommendation.
  OWNER accepted Variant A: elevate regulation to Accepted, normativeAuthority=true.

selectedOption: >
  Variant A: elevate recovery regulation from Proposed to Accepted.
  DOCUMENT-REGISTRY.yaml updated: status=accepted, normativeAuthority=process,
  currentNormativeAuthority=true, decisionRef=RECOVERY-REGULATION-R1.
  Regulation header updated: documentStatus=Accepted, normativeAuthority=true,
  ownerAcceptanceRequired=false, ownerDecisionRef=RECOVERY-REGULATION-R1.
  CI authority validation strengthened: normativeAuthority must be in
  allowlist {process, product, canonical}; status must be accepted;
  currentNormativeAuthority must be true; decisionRef must reference a
  committed docs/decisions/ artifact.
  Variant B (keep proposed, remove binding) rejected: does not provide
  autonomous fail-closed recovery.

securityImpact: >
  Recovery transitions (PRESERVE_AND_STOP, RECOVER_COORDINATION_STATE,
  RESUME_ASSIGNMENT, FREEZE_FOR_REVIEW) are now enforced by a mandatory
  accepted norm. Agents cannot bypass recovery by omitting the regulation
  or declaring it non-binding. CI fails if the regulation is absent from
  the Registry or has non-accepted status or non-normative authority.
  Fail-closed property: CI enforces that the accepted regulation is present
  and backed by a committed class-R decision artifact.

effects:
  - recovery regulation becomes mandatory
  - DOCUMENT-REGISTRY records status=accepted, normativeAuthority=process
  - AGENTS.md recovery binding remains mandatory
  - recovery governance CI remains blocking
  - decisionRef validated against committed docs/decisions/ artifact (A01)

excludedEffects:
  - no other Proposed document is promoted
  - unknown working-tree changes receive no ownership
  - Review and Audit requirements are not weakened
  - exact-subject requirements remain mandatory

mutation:
  revertToProposed:
    description: Set status=proposed in DOCUMENT-REGISTRY.yaml for the regulation
    result: killed
    killedBy: AUTHORITY_REGRESSION_PASS (governance check rc=1)
  removeNormativeAuthority:
    description: Set normativeAuthority=none in DOCUMENT-REGISTRY.yaml
    result: killed
    killedBy: AUTHORITY_REGRESSION_PASS (governance check rc=1)
  removeDecisionArtifact:
    description: Delete docs/decisions/RECOVERY-REGULATION-R1.yaml
    result: killed
    killedBy: governance check rc=1 (decisionRef artifact missing)

review:
  class: R
  requirements:
    - independent Reviewer (codex:workspace-c19, not Executor opencode:workspace-oa1)
    - independent Auditor (opencode:workspace-o1e, not Executor or Reviewer)
    - authority validation in CI with mutation regression
    - decisionRef file existence verified by check-recovery-governance.py

rollback: >
  Set status=proposed, normativeAuthority=proposed_direction,
  currentNormativeAuthority=false, remove decisionRef in DOCUMENT-REGISTRY.yaml.
  Set documentStatus=Proposed, normativeAuthority=false, ownerAcceptanceRequired=true,
  remove ownerDecisionRef in regulation header.
  Delete docs/decisions/RECOVERY-REGULATION-R1.yaml.
  Remove decisionRef validation from check-recovery-governance.py.
  All prior review subjects remain valid.