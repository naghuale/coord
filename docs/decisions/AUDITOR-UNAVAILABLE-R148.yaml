decision: R148
class: R
status: accepted
title: "Auditor unavailability and recovery path (AUDITOR-UNAVAILABLE-R1)"
issue: null

decisionDate: "2026-10-21"
acceptanceDate: "2026-10-21"

ownerDecision:
  decisionId: R148
  ownerMessage: "принимаю оба"
  disposition: ACCEPTED
  recordedBy: "Claude Opus 5.5 (coordinator session)"
  recordedAt: "2026-10-21"
  ownerTimeoutCorrection: >
    OWNER скорректировал пороги (2026-10-21): t+1h AUDITOR_STALLED,
    t+3h FALLBACK_AUDITOR_ALLOWED, t+5h OWNER_ESCALATION_REQUIRED.
    Затем OWNER ввёл два класса аудита: сокращённые пороги применяются к
