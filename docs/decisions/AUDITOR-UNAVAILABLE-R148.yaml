normativeRuleText: |
  ### Недоступность аудитора (AUDITOR-UNAVAILABLE-R1, R148)

  Каждое audit assignment при dispatch получает класс: operational (live pilot,
  runtime breakage, self-hosting defect, governance blocker, release blocker —
  с доказательством) или standard (всё остальное). Повысить класс после
  dispatch нельзя; это делается только новым assignment.

  | Класс | нет ACK | молчание после ACK | fallback | эскалация OWNER |
  |---|---|---|---|---|
  | operational | 30 мин | 1 ч | 3 ч | 5 ч |
  | standard | 2 ч | 4 ч | 24 ч | 72 ч |

  При молчании Coordinator фиксирует AUDITOR_STALLED, отправляет запрос
  статуса и продолжает независимую работу. По истечении срока fallback
  Coordinator без вопроса OWNER назначает fallback-аудитора строго на тот же
  exact subject SHA; если на ветке появились новые коммиты, создаётся новое
  audit assignment, а прежнее закрывается как SUPERSEDED. По истечении срока
  эскалации без принятого аудита Coordinator эскалирует OWNER с Decision Trace.

  Fallback-аудитор MUST NOT быть исполнителем subject (в любой сессии и модели
  этого агента) и MUST NOT быть Reviewer этого subject. Другая модель агента-
  исполнителя не является fallback-аудитором.

  Coordinator audit (мутанты, runtime-анализ, contract review) разрешён всегда,
  но MUST NOT выдавать AUDIT_ACCEPTED/AUDIT_REJECTED и не открывает gate.
  Limited shadow-only pilot до AUDIT_ACCEPTED допускается только явным решением
  OWNER при эскалации.

mutation:
  coordinatorSelfAudit:
    description: Allow coordinator-authored subject to be audited by any Claude session
    expectedResult: KILLED
    killedBy: "fallback eligibility test (not yet implemented)"
  infiniteWait:
    description: Remove ownerEscalation timeout
    expectedResult: KILLED
    killedBy: "stall timeline test (not yet implemented)"
  raiseClassAfterDispatch:
    description: Allow auditClass to change from standard to operational after dispatch
    expectedResult: KILLED
    killedBy: "class immutability test (not yet implemented)"
  fallbackOnNewerSha:
    description: Accept fallback audit result for a SHA other than the original assignment
    expectedResult: KILLED
    killedBy: "subject binding test (not yet implemented)"
  autoLimitedPilot:
    description: Admit limited pilot without OWNER decision
    expectedResult: KILLED
    killedBy: "limited pilot gate test (not yet implemented)"

