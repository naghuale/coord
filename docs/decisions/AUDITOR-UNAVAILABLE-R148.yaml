normativeRuleText: |
  ### Недоступность аудитора (AUDITOR-UNAVAILABLE-R1, R148)

  Если назначенный аудитор не прислал ACK за 30 минут или после ACK молчит
  1 час, Coordinator фиксирует AUDITOR_STALLED, отправляет запрос статуса и
  продолжает независимую работу. Через 3 часа без результата Coordinator
  без вопроса OWNER назначает fallback-аудитора на тот же exact subject SHA.
  Через 5 часов без принятого аудита и без доступного fallback Coordinator
  эскалирует OWNER с Decision Trace.

  Fallback-аудитор MUST NOT быть исполнителем subject (в любой сессии и модели
  этого агента) и MUST NOT быть Reviewer этого subject. Другая модель агента-
  исполнителя не является fallback-аудитором.

  Coordinator audit (мутанты, runtime-анализ, contract review) разрешён всегда,
  но MUST NOT выдавать AUDIT_ACCEPTED/AUDIT_REJECTED и не открывает gate.
  Limited shadow-only pilot до AUDIT_ACCEPTED допускается только явным решением
  OWNER при эскалации.

mutation:
  coordinatorSelfAudit:
    description: Allow coordinator-authored subject to be audited by any Claude session
    expectedResult: KILLED
    killedBy: "fallback eligibility test (not yet implemented)"
  infiniteWait:
    description: Remove ownerEscalation timeout
    expectedResult: KILLED
    killedBy: "stall timeline test (not yet implemented)"
  autoLimitedPilot:
    description: Admit limited pilot without OWNER decision
    expectedResult: KILLED
    killedBy: "limited pilot gate test (not yet implemented)"

normativeStatus: PROPOSED
