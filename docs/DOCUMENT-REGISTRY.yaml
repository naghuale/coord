      - IMPLEMENTATION
      - REVIEW
      - AUDIT
    updateWhen:
      - PRODUCT_NORM_CHANGED
    currentOperationalAuthority: false
    canonicalProductionAuthority: true
    normativeAuthority: product
    ownership:
      creates: COORDINATOR
      updates: EXECUTOR
      accountable: OWNER
    acceptance:
      reviewer: required
      auditor: conditional_if_TD_R2
      owner: required
    related:
