apiVersion: coord.dev/v1alpha1
kind: DocumentRegistry
metadata:
  projectId: coord
  registryVersion: 1
  purpose: 'Машиночитаемый реестр документации Coord: назначение, authority, пользователи, события чтения и обновления,
    порядок приёмки и связи.'
  owningDocument: AGENTS.md
vocabulary:
  classes:
    normative: Продуктовые нормы и обязательные инварианты.
    architecture_status: Текущее устройство, зрелость и путь к принятой норме.
    process: Правила разработки, оркестрации, проверки и эскалации.
    operations: Инструкции запуска, диагностики и эксплуатации конкретного контура.
    active_context: Текущее состояние проекта и следующая безопасная работа.
    historical: Исторические evidence и снимки, не являющиеся текущей authority.
    design: Проектирование реализации в пределах принятых норм.
  statuses:
    active: Действующий документ.
    accepted: Принятая нормативная запись.
    proposed: Предложение; не является действующей capability или нормой.
    legacy: Документ действующего legacy-контура; не применяется к новой canonical разработке.
    historical: Зафиксированный исторический снимок; не обновляется под текущий код.
    generated: Производная проекция; источник задаётся отдельно.
  roles:
    - OWNER
    - COORDINATOR
    - EXECUTOR
    - REVIEWER
    - AUDITOR
    - OPERATOR
  readEvents:
    - SESSION_START
    - CONTEXT_RECOVERY
    - ISSUE_PLANNING
    - ASSIGNMENT_START
    - IMPLEMENTATION
    - REVIEW
    - AUDIT
    - OWNER_BOUNDARY_CHECK
    - COMMIT_READINESS
    - ARCHITECTURE_IMPACT
    - RUNTIME_START
    - INCIDENT
    - MIGRATION
    - HISTORICAL_INVESTIGATION
    - ACTION_MAP_SCENARIO_VALIDATION
  updateEvents:
    - PRODUCT_NORM_CHANGED
    - PROCESS_NORM_CHANGED
    - COMPONENT_IMPLEMENTATION_CHANGED
    - COMPONENT_MATURITY_CHANGED
    - CLI_CHANGED
    - PROTOCOL_CHANGED
    - RUNTIME_BEHAVIOR_CHANGED
    - WORKSPACE_POLICY_CHANGED
    - STATE_MACHINE_TRANSITION
    - ISSUE_STATE_CHANGED
    - ASSIGNMENT_CHANGED
    - REVIEW_COMPLETED
    - AUDIT_COMPLETED
    - INTEGRATION_COMPLETED
    - INCIDENT_RECORDED
    - RESOLUTION_REFERENCE_ADDED
precedence:
  product:
    - accepted ADR
    - docs/TASK-MODEL.md
    - recorded OWNER decisions Rxx in the owning document
    - docs/TARGET-ARCHITECTURE.md
    - docs/ROADMAP.md
    - design documents
    - operational guides
    - historical evidence
  process:
    - AGENTS.md
    - Coordinator State Machine
    - active assignment
    - Operations Ledger
    - role prompts
    - development and verification guides
  implementationStatus:
    - docs/architecture/COMPONENT-STATUS.yaml
    - docs/ARCHITECTURE.md
    - docs/TARGET-ARCHITECTURE.md
invariantOwners:
  - id: canonical-coordination-model
    source: docs/ADR-0001-CANONICAL-COORDINATION-MODEL.md
  - id: task-lifecycle-and-run-binding
    source: docs/TASK-MODEL.md
  - id: project-dependency-graph
    source: docs/ADR-0002-PROJECT-DEPENDENCY-GRAPH.md
  - id: external-reference-model
    source: docs/ADR-0003-EXTERNAL-REFERENCE-MODEL.md
  - id: runtime-and-daemon-model
    source: docs/ADR-0004-RUNTIME-AND-DAEMON-MODEL.md
  - id: storage-and-durability
    source: docs/ADR-0005-STORAGE-MODEL.md
rules:
  - id: DR-001
    text: Каждый документ MUST иметь один class, status, purpose, usedBy, readWhen и updateWhen.
  - id: DR-002
    text: Historical documents MUST NOT иметь currentOperationalAuthority=true.
  - id: DR-003
    text: Legacy guides MUST NOT объявляться canonical production authority.
  - id: DR-004
    text: Accepted norms изменяются только отдельной нормативной правкой; реализация нормы не переписывает её автоматически.
  - id: DR-005
    text: Статус реализации компонента хранится в COMPONENT-STATUS.yaml и проецируется в ARCHITECTURE/TARGET-ARCHITECTURE.
  - id: DR-006
    text: Новая документация MUST быть добавлена в этот реестр в той же Issue.
  - id: DR-007
    text: Удаление или переименование документа MUST атомарно обновлять registry, ссылки и проверки.
  - id: DR-008
    text: Автор изменения документа MUST NOT единолично принимать собственную работу.
  - id: DR-009
    text: N/A для update impact требует проверяемой причины.
  - id: DR-010
    text: Credentials, secrets, session tokens и private evidence не регистрируются как документы Git.
startupPaths:
  coordinator:
    required:
      - .coord/project.yaml
      - AGENTS.md
      - .coord/CONTEXT-INDEX.yaml
      - operations/project/CURRENT.yaml
      - operations/project/OPEN-WORK.yaml
    conditional:
      - active assignment
      - owning accepted norms
      - docs/architecture/COMPONENT-STATUS.yaml
    forbiddenByDefault:
      - historical documents
      - complete tool logs
      - closed task transcripts
  executor:
    required:
      - AGENTS.md
      - active assignment
      - WorkspaceBinding
      - owning accepted norms
    conditional:
      - component design
      - relevant operational guide
  reviewer:
    required:
      - AGENTS.md
      - active assignment
      - frozen subject revision
      - owning accepted norms
      - required tests and mutations
    conditional:
      - docs/architecture/COMPONENT-STATUS.yaml
      - affected architecture documents
  auditor:
    required:
      - AGENTS.md
      - active assignment
      - frozen subject revision
      - security/recovery/identity norms
      - negative tests and mutation evidence
      - reviewer verdict
validation:
  allowedClasses:
    - normative
    - architecture_status
    - process
    - operations
    - active_context
    - historical
    - design
  allowedStatuses:
    - active
    - accepted
    - proposed
    - legacy
    - historical
    - generated
  requiredFields:
    - id
    - path
    - class
    - status
    - purpose
    - usedBy
    - readWhen
    - updateWhen
    - ownership
    - acceptance
    - currentOperationalAuthority
    - canonicalProductionAuthority
    - normativeAuthority
  invariants:
    - document ids are unique
    - document paths are unique
    - every path exists unless optional=true
    - every normative document declares normativeAuthority
    - proposed documents set currentNormativeAuthority=false
    - legacy and historical documents set canonicalProductionAuthority=false
    - historical documents set currentOperationalAuthority=false
    - every update event names an updating role
    - every document names an independent acceptance rule
    - every operations document declares appliesTo, notApplicableTo and currentOperationalAuthority
    - every document file under docs/ and registered repository-root documentation is listed
    - every invariant id maps to exactly one registered normative source
    - DOCUMENT-MAP links resolve to existing files
documents:
  - id: agents
    path: AGENTS.md
    class: process
    status: active
    purpose:
      - repository rules
      - role and authority boundaries
      - OwnerBoundaryCheck
      - mandatory Document Registry and Action Map admission
      - action cards before significant Coordinator transitions
      - Commit Readiness
      - Workspace Root policy
      - Operations Ledger policy
    usedBy:
      - COORDINATOR
      - EXECUTOR
      - REVIEWER
      - AUDITOR
      - OPERATOR
    readWhen:
      - SESSION_START
      - ASSIGNMENT_START
      - OWNER_BOUNDARY_CHECK
      - COMMIT_READINESS
    updateWhen:
      - PROCESS_NORM_CHANGED
      - WORKSPACE_POLICY_CHANGED
    currentOperationalAuthority: true
    canonicalProductionAuthority: false
    normativeAuthority: process
    ownership:
      creates: COORDINATOR
      updates: COORDINATOR
      accountable: OWNER
    acceptance:
      reviewer: required
      auditor: conditional_if_TD_R2
      owner: only_for_class_R
    related:
      - docs/ROLE_PROMPTS.md
      - docs/operations/COORDINATOR-STATE-MACHINE.md
      - docs/operations/ARCHITECTURE-SYNC-PROCESS.md
