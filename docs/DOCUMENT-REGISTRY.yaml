      - AUDITOR
    readWhen:
      - ISSUE_PLANNING
      - IMPLEMENTATION
      - REVIEW
      - AUDIT
    updateWhen:
      - PRODUCT_NORM_CHANGED
    currentOperationalAuthority: false
    canonicalProductionAuthority: true
    normativeAuthority: product
    ownership:
      creates: COORDINATOR
      updates: EXECUTOR
      accountable: OWNER
    acceptance:
