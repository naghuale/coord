unregisteredDocumentPolicy:
  action: fail
  code: DOCUMENT_NOT_REGISTERED
  exceptions:
    - generated temporary outputs under project-local .scratch
    - private evidence excluded from Git
    - vendored third-party documentation
changeMatrix:
  PRODUCT_NORM_CHANGED:
    mustConsider:
      - owning ADR or TASK-MODEL
      - docs/architecture/COMPONENT-STATUS.yaml
      - docs/TARGET-ARCHITECTURE.md
      - docs/ROADMAP.md
      - CHANGELOG.md
    ownerBoundaryCheck: required
  COMPONENT_IMPLEMENTATION_CHANGED:
    mustConsider:
      - docs/architecture/COMPONENT-STATUS.yaml
      - docs/ARCHITECTURE.md
      - docs/TARGET-ARCHITECTURE.md
      - docs/VERIFICATION.md
      - CHANGELOG.md
    ownerBoundaryCheck: false
  PROCESS_NORM_CHANGED:
    mustConsider:
      - AGENTS.md
      - docs/ROLE_PROMPTS.md
      - docs/DEVELOPMENT.md
      - docs/VERIFICATION.md
      - docs/operations/COORDINATOR-STATE-MACHINE.md
      - CHANGELOG.md
    ownerBoundaryCheck: conditional
  CLI_CHANGED:
    mustConsider:
      - docs/OPERATIONS.md
      - docs/QUICKSTART.md
      - matching legacy or current CLI guide
      - CHANGELOG.md
    ownerBoundaryCheck: false
  INTEGRATION_COMPLETED:
    mustUpdate:
      - operations/project/CURRENT.yaml
      - operations/project/OPEN-WORK.yaml
      - Operations Ledger
      - Completion Report
      - Issue status
    ownerBoundaryCheck: false
  SESSION_INTERRUPTED:
    mustRead:
      - docs/operations/AGENT-SESSION-RECOVERY-REGULATION.md
      - docs/operations/ACTION-MAP.yaml
    ownerBoundaryCheck: false
  RECOVER_SESSION:
    mustRead:
      - docs/operations/AGENT-SESSION-RECOVERY-REGULATION.md
      - .coord/project.yaml
      - AGENTS.md
      - .coord/CONTEXT-INDEX.yaml
      - docs/DOCUMENT-REGISTRY.yaml
      - docs/operations/ACTION-MAP.yaml
      - operations/project/CURRENT.yaml
      - operations/project/OPEN-WORK.yaml
    ownerBoundaryCheck: false
