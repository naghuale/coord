limits:
- Selected workflows are plans, not canonical commands or mutation authority.
- Only stale-response handling has a pure local executor in this slice.
- Internal response input must be an authenticated validated Inbox projection; production
  binding is not implemented.
- HEARTBEAT_STALE_OBSERVED is internal; HEARTBEAT_STALE was not inserted into ACTION-MAP
  events.
- SESSION_REPLACED remains a canonical post-replacement event, not an alias for reconcile
  failure.
- External-write Human Action uses existing reason codes only after evidence proves
  physical need; no automatic SYSTEM_DIALOG_REQUIRED mapping.
- Existing watchdog early-return behavior is unchanged; integration of the new completion
  validators requires separate scope.
