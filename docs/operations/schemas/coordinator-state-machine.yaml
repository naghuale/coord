apiVersion: coord.dev/v1alpha1
kind: CoordinatorStateMachine
metadata:
  name: coordinator-state-machine
  status: active for repository development process
  authority: [R127, R142, R145, RFC-0001]
  dependencies: [ADR-0001, ADR-0004, ADR-0005]
  futureDependency: ADR-0009 for proposed session and process lifecycle
  issue: "41"

# ─────────────────────────────────────────────────────────────────────────────
# DEVELOPMENT PROCESS (active — derived from R142, RFC-0001, Operations Ledger)
# ─────────────────────────────────────────────────────────────────────────────

developmentProcess:
  status: active

  # ── Executor verdicts ──────────────────────────────────────────────────────
  executorVerdicts:
    WORK_IN_PROGRESS:
      action: monitor
      coordinatorMustNot:
        - accept work
        - reassign without cause

    READY_FOR_REVIEW:
      action: assign_reviewer
      coordinatorMust:
        - verify file composition
        - verify frozen version and hashes
        - assign independent Reviewer
        - for TD-R2 assign independent Auditor
        - transition to REVIEW_IN_PROGRESS
      ownerRequired: false

    BLOCKED:
      subtypes:
        TECHNICAL_BLOCKER:
          action: resolve_blocker
          ownerRequired: false
        DEPENDENCY_BLOCKER:
          action: track_dependency
          ownerRequired: false
        MISSING_EVIDENCE:
          action: obtain_evidence
          ownerRequired: false
        OWNER_REQUIRED:
          action: present_to_owner
          ownerRequired: true
        EXTERNAL_ACTION_REQUIRED:
          action: prepare exact command or action for authorized person (operator, sysadmin, credential owner)
          ownerRequired: false
          ownerRequiredIf: action is explicitly OWNER-reserved
          note: EXTERNAL_ACTION_REQUIRED is not automatically OWNER_REQUIRED

    STOPPED:
      meaning: Executor stopped and does not claim result readiness
      coordinatorMust:
        - verify actual worktree state
        - determine if useful work was saved
        - classify reason
        - choose one_of: [resume, handoff, cancellation]
        - not treat process as EXITED
        - not treat Task as complete
      causes:
        - TASK_COMPLETED_ELSEWHERE
        - AGENT_UNAVAILABLE
        - TECHNICAL_FAILURE
        - SCOPE_CONFLICT
        - CANCELLED_ASSIGNMENT
        - UNKNOWN_STOP_REASON
      UNKNOWN_STOP_REASON:
        action: gather facts (not automatic OWNER)
      ownerRequired: false

    HANDOFF_REQUIRED:
      coordinatorMust:
        - verify actual disk state
        - save work
        - cancel old assignment
        - create handoff record
        - assign new executor
        - not treat prior session as automatically completed
      ownerRequired: false

  # ── Reviewer verdicts ──────────────────────────────────────────────────────
  reviewVerdicts:
    ACCEPTED:
      coordinatorMust:
        - verify verdict applies to current tree or patch hash
        - verify Reviewer independence
        - verify no changes after verdict
        - continue readiness
      ownerRequired: false

    CHANGES_REQUIRED:
      coordinatorMust:
        - classify each issue as defect/FD/TD/TD-R2
        - return to Executor or run fix cycle
        - require missing negative tests and mutations
        - freeze new version
        - repeat review
        - for TD-R2 repeat audit
        - continue until ACCEPTED or genuine OWNER boundary
      ownerRequired: false
      ownerRequiredIf: issue requires new norm or crosses R142 boundary

    NOT_EVALUATED:
      semantics:
        notSameAs: [PASS, FAIL, "N/A"]
      coordinatorMust:
        - record exactly what was not checked
        - if mandatory check: obtain evidence or assign another reviewer
        - if optional check: record N/A with reason
        - if evidence insufficient: leave NOT_EVALUATED
        - never auto-convert to N/A or PASS
      ownerRequired: false

    INVALID_SUBMISSION:
      causes:
        - unknown base SHA
        - tree changed after submission
        - patch hash mismatch
        - required files missing
        - issues from different tasks mixed
        - reviewer received wrong version
      action: rebuild_frozen_submission
      ownerRequired: false

  # ── Auditor verdicts ──────────────────────────────────────────────────────
  auditorVerdicts:
    AUDIT_ACCEPTED:
      action: continue_readiness
      ownerRequired: false

    CHANGES_REQUIRED:
      classifiedAsTD_R2_if_touching:
        - identity
        - signing
        - authorization
        - AgentSession
        - fencing
        - replay
        - canonical storage
        - recovery
        - containment
        - process control
        - credentials
        - trust boundary
      action: return_to_fix_cycle
      ownerRequired: false

    NOT_EVALUATED:
      semantics:
        notSameAs: ["N/A"]
      action: obtain_evidence_or_tools
      ownerRequired: false

    "N/A":
      requiresMandatoryReason: true
      exampleSchema:
        audit:
          status: "N/A"
          reason: "<why this check does not apply to this change>"

    AUDIT_BLOCKED:
      action: resolve_technical_blocker_first
      ownerRequired: false
      ownerRequiredIf: blocker crosses R142 boundary

  # ── Readiness states ──────────────────────────────────────────────────────
  readinessStates:
    note: >-
      Lists allowed states; not every task must visit every state. A TD (non-TD-R2)
      task skips READY_FOR_AUDIT and AUDIT_IN_PROGRESS. A fix cycle re-enters
      WORK_IN_PROGRESS from any state after CHANGES_REQUIRED.
    sequence:
      - NOT_READY
      - WORK_IN_PROGRESS
      - PRE_REVIEW_BLOCKED
      - READY_FOR_REVIEW
      - REVIEW_IN_PROGRESS
      - READY_FOR_AUDIT
      - AUDIT_IN_PROGRESS
      - READY_FOR_COMMIT
      - COMMITTED
      - PUBLISHED
      - CI_PENDING
      - CI_PASS         # or CI_FAILED
      - READY_FOR_INTEGRATION
      - INTEGRATED
      - COMPLETE

    automaticTransitions:
      READY_FOR_REVIEW:
        trigger: readiness checks pass
        action: assign Reviewer
        next: REVIEW_IN_PROGRESS
        ownerRequired: false

      REVIEW_ACCEPTED_AUDIT_REQUIRED:
        trigger: Reviewer returns ACCEPTED and work is TD-R2
        action: prepare frozen audit submission
        next: READY_FOR_AUDIT
        ownerRequired: false

      REVIEW_ACCEPTED_NO_AUDIT:
        trigger: Reviewer returns ACCEPTED and work is not TD-R2
        action: readiness checks
        next: READY_FOR_COMMIT
        ownerRequired: false

      AUDIT_IN_PROGRESS:
        trigger: Auditor assigned and received frozen submission
        next: AUDIT_IN_PROGRESS
        ownerRequired: false

      AUDIT_ACCEPTED:
        trigger: Auditor returns AUDIT_ACCEPTED
        action: verify version unchanged; continue readiness
        next: READY_FOR_COMMIT
        ownerRequired: false

      CHANGES_REQUIRED:
        trigger: Reviewer or Auditor returns CHANGES_REQUIRED
        next: WORK_IN_PROGRESS
        then: fix → new freeze → READY_FOR_REVIEW
        ownerRequired: false

      READY_FOR_COMMIT:
        trigger: all checks pass, review accepted, audit accepted or N/A
        action: create local commit
        next: COMMITTED
        ownerRequired: false

      COMMITTED:
        action: push
        next: PUBLISHED
        then: CI_PENDING
        ownerRequired: false

      CI_PASS:
        trigger: CI green on correct commit SHA
        action: integration if permitted
        next: INTEGRATED
        ownerRequired: false

      COMPLETE:
        trigger: INTEGRATED + Completion Report published + Ledger updated + CURRENT/OPEN-WORK updated
        action: close task
        next: COMPLETE
        ownerRequired: false

      CI_FAILED_PRODUCT_TEST_DOCS:
        trigger: CI_FAILED classified as PRODUCT_FAILURE, TEST_FAILURE, or DOCUMENTATION_FAILURE
        action: fix code or test
        next: WORK_IN_PROGRESS
        ownerRequired: false

      CI_FAILED_INFRASTRUCTURE:
        trigger: CI_FAILED classified as INFRASTRUCTURE_FAILURE
        action: retry per accepted retry policy
        next: CI_PENDING
        ownerRequired: false

      CI_FAILED_WRONG_SHA:
        trigger: CI_FAILED classified as WRONG_SUBJECT_SHA
        action: run CI for correct commit SHA
        next: CI_PENDING
        ownerRequired: false

  # ── Check results ─────────────────────────────────────────────────────────
  checkResults:
    PASS:
      meaning: check confirmed specific property
    FAIL:
      meaning: property violated
      action: start fix cycle
    NOT_EVALUATED:
      meaning: check not performed
      mustNotConvertTo: [PASS, "N/A"]
    "N/A":
      requiresReason: true
    INCONCLUSIVE:
      meaning: check performed but evidence insufficient or ambiguous
      coordinatorMust:
        - not convert to PASS
        - identify missing evidence
        - repeat check or stop at genuine boundary

  # ── Mutation results ──────────────────────────────────────────────────────
  mutationResults:
    KILLED:
      meaning: tests detected meaningful break

    SURVIVED:
      coordinatorMust:
        determine_one_of:
          - real_test_gap:
              action: add test
          - equivalent_mutation:
              action: record as EQUIVALENT with evidence
      mustNotAutoAccept: true

    EQUIVALENT:
      requiresEvidence: true
      schema:
        mutation:
          result: EQUIVALENT
          observableBehaviorChanged: false
          rationale: "<why behavior does not change>"
          verifiedBy:
            - reviewer
      bareResultIsInsufficient: true

    NOT_RUN:
      successful: false

    INVALID_MUTATION:
      causes:
        - does not compile
        - breaks unrelated contract
        - does not test claimed property
      successful: false

  # ── CI failure classification ─────────────────────────────────────────────
  ciFailureClassification:
    PRODUCT_FAILURE:
      action: fix code
    TEST_FAILURE:
      action: fix test or code
    DOCUMENTATION_FAILURE:
      action: fix documentation
    INFRASTRUCTURE_FAILURE:
      action: retry per accepted retry policy
      note: infrastructure failure must not mask product failure
    FLAKY_TEST_SUSPECTED:
      action: prove flakiness — do not retry until green blindly
    WRONG_SUBJECT_SHA:
      action: run CI for correct commit SHA

  # ── Commit blocked reasons ────────────────────────────────────────────────
  commitBlockedReasons:
    - REVIEW_MISSING
    - AUDIT_MISSING
    - MANDATORY_CHECK_FAILED
    - STAGED_DIFF_MISMATCH
    - FILES_CHANGED_AFTER_REVIEW
    - GATE_REVIEW_MISSING
    - ISSUE_SCOPE_VIOLATION

  # ── Context states ────────────────────────────────────────────────────────
  contextStates:
    CONTEXT_READY:
      meaning: all 6 probes passed
    CONTEXT_INCOMPLETE:
      meaning: required fact missing
      action: load only needed source via CONTEXT-INDEX
    CONTEXT_STALE:
      meaning: source changed after summary was created
      action: re-read source
      ownerRequired: false
    CONTEXT_CONFLICT:
      meaning: two loaded sources contradict each other
      action: apply source hierarchy
    RECOVERY_CONFLICT:
      meaning: Operations Ledger, GitHub Issue, refs or CI diverge
      action: block_and_reconcile_facts
      ownerRequired: false
      ownerRequiredIf: conflict cannot be resolved under applicable authority (R142 boundary)
    LOCAL_CONFIG_STALE:
      meaning: local configuration no longer matches accepted project state (e.g. after migration)
      action: compute_expected_values_from_accepted_configuration
      next: LOCAL_CONFIG_SYNC_REQUIRED
      ownerRequired: false
    LOCAL_CONFIG_SYNC_REQUIRED:
      meaning: expected local configuration computed and not yet applied
      action: update_and_verify_local_configuration
      next: CONTEXT_READY
      ownerRequired: false

  # ── Local configuration ───────────────────────────────────────────────────
  localConfiguration:
    HUMAN_ACTION_REQUIRED:
      action: prepare_exact_human_command
      ownerRequired: conditional
      ownerRequiredOnlyIf:
        - ownerReservedAction
        - newNorm
        - riskAcceptance
        - trustBoundaryChange
      note: HUMAN_ACTION_REQUIRED MUST NOT automatically convert to OWNER_REQUIRED

  # ── Events ────────────────────────────────────────────────────────────────
  events:
    REPOSITORY_PATH_MIGRATED:
      action:
        - update_projects_yaml
        - update_environment_bootstrap
        - update_context_files
        - verify_repository_identity
        - search_for_stale_path_references
        - update_operations_ledger
      ownerRequired: false

  # ── Next-action states ───────────────────────────────────────────────────
  nextActionStates:
    NEXT_ACTION_REQUIRED:
      action: derive_next_action_from_state_machine_norms_roadmap_ledger
      next:
        autonomous: EXECUTION_CONTINUES
        uncertain: OWNER_BOUNDARY_CHECK
      ownerRequired: false

    OWNER_BOUNDARY_CHECK:
      action: verify_r142_boundary_with_decision_trace
      next:
        boundaryConfirmed: OWNER_REQUIRED
        boundaryNotConfirmed: QUESTION_SUPPRESSED
      ownerRequired: false

    QUESTION_SUPPRESSED:
      action: execute_derived_autonomous_transition
      ownerRequired: false

    ISSUE_CLOSURE_REQUIRED:
      action:
        - verify_completion_report
        - verify_ci_and_integration_sha
        - close_issue
        - update_current_yaml
        - update_open_work_yaml
      next: CONTEXT_SYNC_REQUIRED
      ownerRequired: false

    CONTEXT_SYNC_REQUIRED:
      action:
        - compact_completed_work
        - activate_next_task
        - run_context_probes
      next: CONTEXT_READY
      ownerRequired: false

    OWNER_NOTIFICATION:
      action: post_brief_completion_fact_to_owner
      ownerDecisionRequired: false
      note: OWNER_NOTIFICATION MUST NOT convert to OWNER_REQUIRED

  # ── Coordinator priority order ────────────────────────────────────────────
  coordinatorPriorityOrder:
    - securityOrFailClosedDefect
    - changesRequired
    - completeActiveReviewOrAudit
    - completeActiveIssue
    - closeConfirmedCompleteIssue
    - eliminateNearestBlocker
    - executeNextRoadmapStep
    - selectNewReadyTask
    - ownerRequiredOnlyAtConfirmedR142Boundary

  # ── Prohibited OWNER question reasons ────────────────────────────────────
  prohibitedOwnerQuestionReasons:
    - coordinator uncertain without prior source lookup
    - no active Reviewer or Auditor
    - Reviewer or Auditor returned CHANGES_REQUIRED
    - CI failed
    - evidence missing
    - context stale or incomplete
    - need to create worktree, branch, Issue or assignment
    - need to commit, push or perform approved integration
    - need to install already-accepted local tool
    - local path changed after accepted migration
    - file is outside Git repo but inside approved root
    - need to update projects.yaml, environment or context files
    - need to close a confirmed-complete Issue
    - multiple technical approaches with same observable result
    - no literal instruction but decision follows from active norms
    - need to select next task by accepted ROADMAP

  # ── Behavior metrics ──────────────────────────────────────────────────────
  behaviorMetrics:
    unnecessaryOwnerQuestions: 0
    suppressedOwnerQuestions: 0
    ownerQuestionsWithBoundaryEvidence: 0
    ownerQuestionsWithoutBoundaryEvidence: 0
    gates:
      - ownerQuestionsWithoutBoundaryEvidence > 0: ContextCheck FAIL
      - unnecessaryOwnerQuestions > 0: CoordinatorAutonomyScenario FAIL

  # ── Behavioral scenarios ──────────────────────────────────────────────────
  behavioralScenarios:
    scenario_1_active_issue_not_complete:
      given: {issue: active, nextStepKnown: true, anotherMilestoneAvailable: true}
      expect: {ownerQuestion: false, action: complete_active_issue}
    scenario_2_changes_required:
      given: {verdict: CHANGES_REQUIRED, findingsWithinScope: true, newNormRequired: false}
      expect: {ownerQuestion: false, action: fix_and_repeat_review}
    scenario_3_path_changed_after_migration:
      given: {migrationAccepted: true, repositoryPathChanged: true}
      expect: {ownerQuestion: false, action: sync_local_configuration}
    scenario_4_human_launch_required:
      given: {commandPrepared: true, productDecisionMade: true, physicalLaunchRequiresHuman: true}
      expect: {result: HUMAN_ACTION_REQUIRED, ownerDecisionRequired: false}
    scenario_5_next_milestone_defined:
      given: {currentMilestoneComplete: true, nextMilestoneDefined: true, entryGatesCheckable: true}
      expect: {ownerQuestion: false, action: evaluate_entry_readiness}
    scenario_6_genuine_norm_conflict:
      given: {acceptedNormA: present, acceptedNormB: incompatible, technicalResolutionPossible: false}
      expect: {result: OWNER_REQUIRED, action: present_conflict_and_options}

  # ── Scenarios ─────────────────────────────────────────────────────────────
  scenarios:
    repository_path_changed_after_accepted_migration:
      classification: FD
      ownerRequired: false
      requiredActions:
        - update COORD_REPOSITORY_ROOT
        - update projects.yaml
        - update bootstrap environment file
        - update CURRENT.yaml
        - verify branch, HEAD, remote and worktrees
        - ensure old path is not referenced
      optionalHumanAction:
        action: launch frontend with prepared environment
        classification: HUMAN_ACTION_REQUIRED
        ownerDecisionRequired: false

  # ── Decision states ───────────────────────────────────────────────────────
  decisionStates:
    FD:
      meaning: direct deduction from active norm
      action: coordinator applies and records
    TD:
      meaning: reversible technical decision in delegated domain
      requires: independent review
    TD_R2:
      meaning: >-
        technical decision in identity/signing/authorization/AgentSession/fencing/replay/
        canonical storage/recovery/containment/process control/credentials/trust boundary
      requires:
        - Reviewer
        - independent Auditor
        - negative tests
        - mutations
    R:
      meaning: new or changed norm
      requires: OWNER only
    OWNER_REQUIRED:
      usage: only at proven R142 boundary
    QUESTION_SUPPRESSED:
      meaning: OwnerBoundaryCheck found no confirmed R142 boundary
      action: coordinator must not send question — execute next autonomous transition
      ownerRequired: false
    HUMAN_ACTION_REQUIRED:
      meaning: requires human operator action (physical, MFA, credential, visual confirmation) but not OWNER product decision
      note: HUMAN_ACTION_REQUIRED != OWNER_REQUIRED
      action: prepare exact action for the authorized person
      ownerRequired: false
      ownerRequiredIf: the action is explicitly OWNER-reserved
    FORBIDDEN:
      meaning: action violates active norm, cannot be authorized by ordinary technical decision
    INSUFFICIENT_EVIDENCE:
      action: gather facts first — not ask OWNER technical question
    NORM_CONFLICT:
      meaning: active norms give incompatible answers
      action: show conflict and options to OWNER
      ownerRequired: true

  # ── OwnerBoundaryCheck gate ───────────────────────────────────────────────
  ownerBoundaryCheck:
    mandatory: true
    when: before sending any question to OWNER
    must:
      - state the question
      - list verified facts
      - name applicable rules
      - check each R142 boundary explicitly
    boundaries:
      - newOrChangedNorm: OWNER_REQUIRED
      - normConflict: OWNER_REQUIRED
      - trustBoundaryChange: OWNER_REQUIRED
      - agentRightsChange: OWNER_REQUIRED
      - failClosedWeakening: OWNER_REQUIRED
      - irreversibleRiskAcceptance: OWNER_REQUIRED
      - differentUserOrProductConsequences: OWNER_REQUIRED
      - ownerReservedAction: OWNER_REQUIRED
      - personalDecisionMFAPasswordPhysical: HUMAN_ACTION_REQUIRED
      - noneConfirmed: QUESTION_SUPPRESSED
    notR142Boundaries:
      - missing Reviewer
      - unfinished technical task
      - CHANGES_REQUIRED
      - CI_FAILED
      - CONTEXT_STALE
      - handoff needed
      - installation of accepted local tool
      - choosing next State Machine transition
      - insufficient evidence

  # ── Coordinator autonomy table ────────────────────────────────────────────
  autonomyTable:
    - result: READY_FOR_REVIEW
      action: assign Reviewer
      ownerRequired: false
    - result: REVIEW_ACCEPTED
      action: continue readiness (assign Auditor if TD-R2, else → READY_FOR_COMMIT)
      ownerRequired: false
    - result: AUDIT_ACCEPTED
      action: continue readiness → READY_FOR_COMMIT
      ownerRequired: false
    - result: CI_PASS
      action: integration if permitted → INTEGRATED
      ownerRequired: false
    - result: CHANGES_REQUIRED
      action: fix and repeat review
      ownerRequired: false
    - result: NOT_EVALUATED
      action: get evidence or another reviewer
      ownerRequired: false
    - result: CI_FAILED
      action: classify then fix
      ownerRequired: false
    - result: SURVIVED
      action: check gap or equivalence
      ownerRequired: false
    - result: CONTEXT_STALE
      action: re-read source
      ownerRequired: false
    - result: HANDOFF_REQUIRED
      action: save and transfer work
      ownerRequired: false
    - result: INSUFFICIENT_EVIDENCE
      action: gather facts
      ownerRequired: false
    - result: NORM_CONFLICT
      action: prepare options for OWNER
      ownerRequired: true
    - result: R
      action: transmit exact question to OWNER
      ownerRequired: true
    - result: TRUST_BOUNDARY_CHANGE
      action: present change and options to OWNER
      ownerRequired: true
    - result: AGENT_RIGHTS_CHANGE
      action: present change and options to OWNER
      ownerRequired: true
    - result: IRREVERSIBLE_RISK
      action: prepare options for OWNER
      ownerRequired: true
    - result: DIFFERENT_USER_CONSEQUENCES
      action: prepare options for OWNER
      ownerRequired: true
    - result: OWNER_RESERVED_ACTION
      action: transmit to OWNER
      ownerRequired: true
    - result: MFA_OR_PASSWORD_REQUIRED
      action: prepare exact human action
      ownerRequired: true
    - result: FAIL_CLOSED_WEAKENING
      action: do not execute without decision
      ownerRequired: true

# Assignment lifecycle belongs to active coordinator process control. It is not
# evidence that the product currently provides a production session launcher.
assignmentLifecycle:
  status: active-process-rule
  states:
    CREATED:
      meaning: assignment сформирован
    DELIVERED:
      meaning: transport принял сообщение
    QUEUED:
      meaning: сообщение ожидает обработки занятой сессией
    ADMITTED:
      meaning: сессия проверила assignment и exact subject
      requiresRecorded: [assignmentId, subjectSha, sessionId, generation, evidence]
    RUNNING:
      meaning: подтверждено начало выполнения
      requiresRecorded: [assignmentId, subjectSha, sessionId, generation, evidence]
    RESULT_READY:
      meaning: структурированный результат записан
    COMPLETED:
      meaning: Coordinator проверил и принял результат
    INTERRUPTED:
      meaning: выполнение прервано
    FENCED:
      meaning: старая сессия утратила authority
    UNKNOWN:
      meaning: состояние не доказано
  nonEquivalences:
    - [DELIVERED, ADMITTED]
    - [ADMITTED, RUNNING]
    - [RUNNING, COMPLETED]
  event:
    AGENT_ASSIGNMENT_DISPATCHED:
      transition: ADVANCE_DISPATCHED_WORK
      must:
        - inspect_session_state
        - verify_assignment_binding
        - verify_subject_sha
        - establish_admission_state
        - start_agent_if_authorized
        - process_available_results
        - perform_independent_coordination_work
      mustNot:
        - passively_wait_for_notification
        - report_future_delivery
        - treat_idle_as_running
        - treat_queued_as_admitted
        - ask_owner_what_to_do_next
      results:
        - AGENT_RUNNING
        - AGENT_RESULT_RECEIVED
        - AGENT_SESSION_RECONCILE_REQUIRED
        - HUMAN_ACTION_REQUIRED
        - BLOCKED_EXTERNAL
      ownerRequired: false
  advanceLoop:
    processReadyEventsUntil:
      - HUMAN_ACTION_REQUIRED
      - BLOCKED_EXTERNAL
      - OWNER_REQUIRED_with_proven_boundary
      - NO_READY_EVENT_and_no_independent_work
    afterDurableWork: process_newly_ready_events
  completionGate:
    rejects:
      - PASSIVE_FUTURE_PROMISE
      - PENDING_SESSION_STATE_MISSING
      - DELIVERED_NOT_ADMITTED
      - QUEUED_NOT_RUNNING
      - COORDINATOR_STOPPED_EARLY
      - OWNER_BOUNDARY_NOT_PROVEN
      - SESSION_RECONCILE_REQUIRED
    noReadyEventRequires:
      - pending_assignment_session_state_and_expected_event
      - completed_independent_work_inventory
  behavioralScenarios:
    idle_after_delivery:
      given: {transportDelivery: true, sessionState: IDLE}
      expect: {startIfAuthorized: true, verifyAdmission: true, ownerRequired: false}
    busy_with_queued_assignment:
      given: {sessionState: BUSY, deliveryState: QUEUED}
      expect: {result: AGENT_SESSION_RECONCILE_REQUIRED, ownerRequired: false}
      must: [record_pending_admission, select_independent_work, reconcile_agent_session]
    reviewer_result_ready:
      given: {verdict: REVIEW_ACCEPTED, exactSubjectVerified: true}
      expect: [create_audit_assignment, start_auditor_if_authorized]
    reviewer_changes_required:
      given: {verdict: CHANGES_REQUIRED}
      expect: [classify_findings, create_correction_assignment, repeat_review]
      ownerRequired: false

# ─────────────────────────────────────────────────────────────────────────────
# SESSION LIFECYCLE (proposed — pending ADR-0009 Session Supervisor)
# NOT normative for current product. Cannot be used as proof of current Coord
# state, basis for process control, or current product capability claim.
# ─────────────────────────────────────────────────────────────────────────────

sessionLifecycle:
  status: proposed
  implementation: pending-ADR-0009
  normativeForCurrentProduct: false
  mayBeUsedFor:
    - design examples
    - threat modeling
    - OpenAPI drafts
    - future transitions
    - classification of known incidents
  mustNotBeUsedFor:
    - proof of current Coord state
    - basis for process control
    - declaring a session REVOKED or process EXITED
    - current product capability claim
  states:
    - DISCOVERED
    - VERIFIED
    - ADMITTED
    - ACTIVE
    - IDLE
    - SUSPECT
    - QUARANTINED
    - REVOKED
    - STALE
  rules:
    NO_RESPONSE_leads_to: SUSPECT
    NO_RESPONSE_NOT: EXITED
    OWNER_ATTESTED_SESSION:
      allows: continued admission
      doesNotAllow: revalidation of old Task assignment

# ─────────────────────────────────────────────────────────────────────────────
# PROCESS LIFECYCLE (proposed — pending ADR-0009)
# Process state must NOT mix with session state.
# ─────────────────────────────────────────────────────────────────────────────

processLifecycle:
  status: proposed
  implementation: pending-ADR-0009
