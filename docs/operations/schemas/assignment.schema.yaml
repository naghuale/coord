$schema: coord.dev/v1alpha1/schema/assignment
description: Assignment record created by Coordinator for each task.

required:
  - projectId
  - issue
  - taskId
  - baseSha
  - assignedBy
  - assignedTo
  - workspace
  - allowedFiles
  - forbidden
  - stopConditions

properties:
  projectId:
    type: string
    example: coord

  issue:
    type: integer
    example: 35

  taskId:
    type: string
    pattern: "^task_[0-9A-Z]{26}$"

  baseSha:
    type: string
    pattern: "^[0-9a-f]{40}$"

  assignedBy:
    type: object
    required: [role, session]
    properties:
      role:
        enum: [COORDINATOR]
      session:
        type: string

  assignedTo:
    type: object
    required: [role, agentId, session]
    properties:
      role:
        enum: [EXECUTOR, REVIEWER, AUDITOR]
      agentId:
        type: string
      session:
        type: string

  workspace:
    type: object
    required: [projectId, localNamespace, launchCwd, assignedWorktree]
    properties:
      projectId:
        type: string
        example: coord
      localNamespace:
        type: string
        example: workspace-01
      launchCwd:
        type: string
        description: >
          Session launch cwd — equals globalRoot, same for ALL roles and ALL projects.
          macOS: /Users/<user>/Downloads/workspace
          Linux: /home/<user>/workspace
        example: /Users/andreybabenko/Downloads/workspace
      assignedWorktree:
        type: string
        description: Absolute path under projectRoot/worktrees/
        example: /Users/andreybabenko/Downloads/workspace/workspace-01/worktrees/issue-35
      operationsWorktree:
        type: string
        description: Absolute path to the role's ledger worktree
        example: /Users/andreybabenko/Downloads/workspace/workspace-01/worktrees/operations-executor
      tempRoot:
        type: string
        example: /Users/andreybabenko/Downloads/workspace/workspace-01/.scratch/tmp
    note: >
      launchCwd != assignedWorktree != projectRoot.
      The agent launches from launchCwd (globalRoot) and accesses
      assignedWorktree via absolute paths and git -C.
      The concept of per-role launch subdirectories (workspace-01/codex,
      workspace-01/opencode) is REMOVED. All roles use launchCwd = globalRoot.

  allowedFiles:
    type: array
    items:
      type: string
    description: Relative paths within assignedWorktree

  forbidden:
    type: array
    items:
      type: string

  stopConditions:
    type: array
    items:
      type: string
