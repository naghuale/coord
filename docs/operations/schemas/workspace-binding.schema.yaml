$schema: coord.dev/v1alpha1/schema/workspace-binding
description: >
  WorkspaceBinding separates session launch directory (globalRoot) from the assigned
  worktree and project root. All agents in all projects share one launch cwd (globalRoot).
  Work isolation is achieved through assignedWorktree and allowedPaths, not through
  different launch directories.

invariant: >
  launchCwd == globalRoot (e.g., /workspace on all platforms)
  projectRoot == {globalRoot}/{localNamespace}
  assignedWorktree starts with projectRoot/worktrees/
  tempRoot starts with projectRoot/.scratch/tmp/
  systemTmp (any platform /tmp equivalent) is denied

platform_note: >
  macOS:   /Users/<user>/Downloads/workspace
  Linux:   /home/<user>/workspace
  Windows: C:\Users\<user>\workspace
  The schema and policy are platform-agnostic.
  Only projects.yaml on the local machine stores the actual globalRoot path.

required:
  - project
  - session
  - assignment
  - repository
  - allowedPaths

properties:
  project:
    required: [projectId, localNamespace, projectRoot]
    properties:
      projectId:
        type: string
        example: coord
      localNamespace:
        type: string
        example: workspace-01
      projectRoot:
        type: string
        description: "{globalRoot}/{localNamespace}"
        example: /Users/andreybabenko/Downloads/workspace/workspace-01

  session:
    required: [sessionAddress, agentId, launchCwd]
    properties:
      sessionAddress:
        type: string
        example: codex:demo-session
      sessionGeneration:
        type: integer
      agentId:
        type: string
      launchCwd:
        type: string
        description: MUST equal globalRoot
        example: /Users/andreybabenko/Downloads/workspace

  assignment:
    required: [issue, taskId, role]
    properties:
      issue:
        type: integer
      taskId:
        type: string
      role:
        enum: [EXECUTOR, REVIEWER, AUDITOR, COORDINATOR]

  repository:
    required: [path, branch, baseSha]
    properties:
      path:
        type: string
        description: Absolute path to the assigned worktree, under projectRoot/worktrees/
        example: /Users/andreybabenko/Downloads/workspace/workspace-01/worktrees/issue-35
      branch:
        type: string
      baseSha:
        type: string
        pattern: "^[0-9a-f]{40}$"

  allowedPaths:
    type: array
    items:
      type: string
    description: Glob patterns (relative to globalRoot) of paths the agent may read/write

  readOnlyPaths:
    type: array
    items:
      type: string

  prohibitedPaths:
    type: array
    items:
      type: string
    description: Explicit denials — other projects, other worktrees, system tmp

  temporaryStorage:
    properties:
      root:
        type: string
        example: /Users/andreybabenko/Downloads/workspace/workspace-01/.scratch/tmp
      systemTmp:
        enum: [deny]
        description: All platform system temp dirs are denied (e.g., /tmp, /private/tmp, C:\Windows\Temp)

admission:
  description: >
    Admission check verifies the session's actual launchCwd equals globalRoot,
    NOT any worktree or project subdirectory.
  checks:
    - name: cwdIsGlobalRoot
      condition: session.launchCwd == globalRoot
    - name: worktreeWithinProject
      condition: repository.path starts with projectRoot/worktrees/
    - name: tempWithinProjectRoot
      condition: temporaryStorage.root starts with projectRoot/.scratch/
    - name: systemTmpDenied
      condition: no access to any platform system temp directory
