apiVersion: coord.dev/v1alpha1
kind: ActionMap
metadata:
  status: proposed
  note: >
    Machine-readable projection of docs/operations/ACTION-MAP.md.
    Both must be kept in sync (Architecture Sync process).
    readWhen values in DOCUMENT-REGISTRY.yaml will be aligned as part of AIAG-03.

events:
  SESSION_STARTED:
    requiredDocuments:
      - project-config
      - agents
      - context-index
      - project-current
      - project-open-work
    allowedActions:
      - verify_project_id
      - verify_integration_head
      - verify_active_issue
      - verify_blockers
      - verify_workspace_binding
      - derive_next_transition
    forbiddenActions:
      - load_historical_by_default
      - ask_owner_what_to_do_next
    expectedResults:
      - CONTINUE_AUTONOMOUSLY
      - BLOCKED
      - OWNER_REQUIRED

  CONTEXT_STALE:
    requiredDocuments:
      - project-current
      - project-open-work
    allowedActions:
      - verify_integration_head
      - reload_active_work
      - update_current_yaml
      - derive_next_transition
    forbiddenActions:
      - continue_without_checking_staleness
    expectedResults:
      - CONTINUE_AUTONOMOUSLY
      - BLOCKED

  ISSUE_CREATED:
    requiredDocuments:
      - agents
      - project-current
      - project-open-work
    allowedActions:
      - record_issue
      - set_labels
      - assign_executor
      - write_assignment
    forbiddenActions:
      - start_work_without_assignment
      - ask_owner_whether_to_create
    expectedResults:
      - CONTINUE_AUTONOMOUSLY

  ASSIGNMENT_STARTED:
    requiredDocuments:
      - agents
      - project-current
      - project-open-work
    allowedActions:
      - verify_workspace_binding
      - verify_base_sha
      - load_owning_norms
      - begin_implementation
    forbiddenActions:
      - load_all_documents
      - start_without_workspace_binding
    expectedResults:
      - CONTINUE_AUTONOMOUSLY
      - BLOCKED

  AGENT_ASSIGNMENT_DISPATCHED:
    transition: ADVANCE_DISPATCHED_WORK
    requiredDocuments:
      - agents
      - project-current
      - project-open-work
    requiredActions:
      - inspect_session_state
      - verify_assignment_binding
      - verify_subject_sha
      - establish_admission_state
      - start_agent_if_authorized
      - process_available_results
      - perform_independent_coordination_work
    allowedActions:
      - inspect_session_state
      - verify_assignment_binding
      - verify_subject_sha
      - establish_admission_state
      - start_agent_if_authorized
      - process_available_results
      - perform_independent_coordination_work
      - record_pending_admission
      - reconcile_agent_session
    forbiddenActions:
      - passively_wait_for_notification
      - report_future_delivery
      - treat_idle_as_running
      - treat_queued_as_admitted
      - ask_owner_what_to_do_next
    allowedResults:
      - AGENT_RUNNING
      - AGENT_RESULT_RECEIVED
      - AGENT_SESSION_RECONCILE_REQUIRED
      - HUMAN_ACTION_REQUIRED
      - BLOCKED_EXTERNAL
    expectedResults:
      - AGENT_RUNNING
      - AGENT_RESULT_RECEIVED
      - AGENT_SESSION_RECONCILE_REQUIRED
      - HUMAN_ACTION_REQUIRED
      - BLOCKED_EXTERNAL
    ownerRequired: false

  CODE_OR_DOCUMENT_CHANGED:
    requiredDocuments:
      - agents
      - project-current
    allowedActions:
      - run_make_check
      - check_git_diff
      - check_staged_diff
      - evaluate_commit_readiness
    forbiddenActions:
      - commit_without_make_check
    expectedResults:
      - CONTINUE_AUTONOMOUSLY
      - READY_FOR_REVIEW
      - READY_FOR_COMMIT

  ARCHITECTURE_IMPACT_DETECTED:
    requiredDocuments:
      - agents
      - component-status
      - architecture-current
      - architecture-sync-process
    allowedActions:
      - classify_impact
      - update_component_status
      - update_architecture_md
      - run_architecture_sync_check
    forbiddenActions:
      - commit_without_architecture_sync
    expectedResults:
      - CONTINUE_AUTONOMOUSLY

  REVIEW_REQUESTED:
    requiredDocuments:
      - agents
      - project-current
    allowedActions:
      - assign_independent_reviewer
      - freeze_subject
      - record_review_assignment
    forbiddenActions:
      - author_reviews_own_work
    expectedResults:
      - CONTINUE_AUTONOMOUSLY
      - BLOCKED

  REVIEW_CHANGES_REQUIRED:
    requiredDocuments:
      - agents
      - project-current
    allowedActions:
      - classify_findings
      - assign_fix
      - add_negative_tests
      - add_mutation_evidence
      - freeze_new_revision
      - repeat_review
      - repeat_audit_if_required
    forbiddenActions:
      - ask_owner_whether_to_fix
      - start_unrelated_issue
    expectedResults:
      - QUESTION_SUPPRESSED
      - OWNER_REQUIRED

  AUDIT_REQUESTED:
    requiredDocuments:
      - agents
      - project-current
    allowedActions:
      - assign_independent_auditor
      - freeze_subject_for_audit
      - record_audit_assignment
    forbiddenActions:
      - author_audits_own_work
      - skip_audit_for_td_r2
    expectedResults:
      - CONTINUE_AUTONOMOUSLY
      - BLOCKED

  OWNER_QUESTION_CANDIDATE:
    requiredDocuments:
      - agents
      - project-current
    allowedActions:
      - run_owner_boundary_check
      - suppress_question_if_no_boundary
      - record_decision_trace
      - escalate_if_boundary_confirmed
    forbiddenActions:
      - ask_owner_without_boundary_check
    expectedResults:
      - QUESTION_SUPPRESSED
      - OWNER_REQUIRED

  HUMAN_ACTION_NEEDED:
    requiredDocuments:
      - agents
    allowedActions:
      - prepare_exact_command
      - record_expected_result
      - wait_for_human_confirmation
    forbiddenActions:
      - convert_to_owner_required
    expectedResults:
      - HUMAN_ACTION_REQUIRED

  MIGRATION_COMPLETED:
    requiredDocuments:
      - agents
      - project-current
    allowedActions:
      - update_local_config
      - verify_new_path
      - verify_no_legacy_references
      - update_operations_ledger
    forbiddenActions:
      - ask_owner_for_local_config_sync
    expectedResults:
      - CONTINUE_AUTONOMOUSLY
      - OWNER_NOTIFICATION

  COMMIT_READINESS_REQUESTED:
    requiredDocuments:
      - agents
      - project-current
      - project-open-work
    allowedActions:
      - run_make_check
      - run_git_diff_check
      - verify_review_verdict
      - verify_audit_verdict_or_na
      - verify_architecture_sync
      - compute_readiness
    forbiddenActions:
      - commit_without_independent_review
      - commit_with_not_evaluated_audit
    expectedResults:
      - READY_FOR_COMMIT
      - BLOCKED

  READY_FOR_COMMIT:
    requiredDocuments:
      - agents
      - project-current
    allowedActions:
      - create_local_commit
      - record_sha
      - update_operations_ledger
      - report_to_owner
    forbiddenActions:
      - push_without_commit_readiness
      - force_push
    expectedResults:
      - CONTINUE_AUTONOMOUSLY
      - OWNER_NOTIFICATION

  INTEGRATION_COMPLETED:
    requiredDocuments:
      - agents
      - project-current
      - project-open-work
    allowedActions:
      - update_integration_head
      - close_issue
      - publish_completion_report
      - update_changelog
    forbiddenActions:
      - close_without_completion_report
    expectedResults:
      - COMPLETE

  CI_FAILED:
    requiredDocuments:
      - agents
      - project-current
    allowedActions:
      - diagnose_failure
      - fix_and_rerun
      - record_blocker_if_external
    forbiddenActions:
      - bypass_ci
      - force_push_to_resolve
    expectedResults:
      - CONTINUE_AUTONOMOUSLY
      - BLOCKED

  BLOCKER_DETECTED:
    requiredDocuments:
      - agents
      - project-current
      - project-open-work
    allowedActions:
      - classify_blocker
      - record_blocker
      - determine_unblocking_action
    forbiddenActions:
      - continue_past_blocker
    expectedResults:
      - BLOCKED
      - OWNER_REQUIRED

  INCIDENT_DETECTED:
    requiredDocuments:
      - agents
      - project-current
    allowedActions:
      - classify_incident
      - record_incident
      - apply_containment
      - prepare_correction
    forbiddenActions:
      - continue_without_incident_record
    expectedResults:
      - BLOCKED
      - OWNER_REQUIRED
      - CONTINUE_AUTONOMOUSLY

  HISTORICAL_INVESTIGATION:
    requiredDocuments:
      - agents
    allowedActions:
      - load_specific_historical_evidence
      - verify_subject_revision
      - note_transferability_limits
    forbiddenActions:
      - treat_historical_as_current
      - load_all_historical_by_default
    expectedResults:
      - CONTINUE_AUTONOMOUSLY
      - NOT_EVALUATED

  SESSION_INTERRUPTED:
    requiredDocuments:
      - agent-session-recovery-regulation
      - agents
    allowedActions:
      - verify_workspace_binding
      - take_git_snapshot
      - load_authoritative_sources
      - classify_working_tree
    forbiddenActions:
      - modify_files
      - commit_changes
      - reset_or_clean
      - delete_unknown_files
      - ask_owner_what_to_do_next
    expectedResults:
      - RECOVER_SESSION

  SESSION_RESUMED:
    requiredDocuments:
      - agent-session-recovery-regulation
      - agents
      - project-config
      - context-index
      - document-registry
      - action-map
      - project-current
      - project-open-work
    allowedActions:
      - verify_workspace_binding
      - take_git_snapshot
      - restore_assignment_context
      - classify_working_tree
      - verify_subject_binding
      - run_safe_checks
      - select_recovery_transition
    forbiddenActions:
      - modify_files_before_recovery_complete
      - start_new_issue
      - reuse_stale_review_verdict
    expectedResults:
      - RESUME_ASSIGNMENT
      - FREEZE_FOR_REVIEW
      - RECOVER_COORDINATION_STATE
      - PREPARE_CORRECTION
      - PRESERVE_AND_STOP
      - BLOCKED_EXTERNAL
      - HUMAN_ACTION_REQUIRED
      - OWNER_REQUIRED

  SESSION_REPLACED:
    requiredDocuments:
      - agent-session-recovery-regulation
      - agents
      - project-current
      - project-open-work
    allowedActions:
      - verify_workspace_binding
      - take_git_snapshot
      - restore_assignment_context
      - classify_working_tree
      - fence_previous_session
    forbiddenActions:
      - modify_files_before_recovery_complete
      - assume_prior_session_stopped_writing
    expectedResults:
      - RESUME_ASSIGNMENT
      - PRESERVE_AND_STOP
      - BLOCKED_EXTERNAL

  CONTEXT_LOST:
    requiredDocuments:
      - agent-session-recovery-regulation
      - agents
      - project-current
      - project-open-work
    allowedActions:
      - verify_workspace_binding
      - take_git_snapshot
      - search_operations_ledger
      - search_git_history
      - classify_working_tree
    forbiddenActions:
      - start_new_work_without_assignment
      - ask_owner_what_to_do_next
    expectedResults:
      - RESUME_ASSIGNMENT
      - PREPARE_CORRECTION
      - PRESERVE_AND_STOP

  WORKTREE_STATE_UNKNOWN:
    requiredDocuments:
      - agent-session-recovery-regulation
      - agents
    allowedActions:
      - classify_working_tree
      - identify_ownership
      - preserve_unknown_changes
    forbiddenActions:
      - modify_unknown_files
      - commit_unclassified_changes
      - reset_or_clean
    expectedResults:
      - RECOVER_COORDINATION_STATE
      - PRESERVE_AND_STOP
      - RESUME_ASSIGNMENT

  REQUIRED_SOURCE_MISSING:
    requiredDocuments:
      - agents
    allowedActions:
      - check_document_registry
      - check_git_history
      - classify_missing_source
      - prepare_correction
    forbiddenActions:
      - use_examples_as_authority
      - use_scratch_as_authority
      - declare_owner_required_automatically
    expectedResults:
      - PREPARE_CORRECTION
      - OWNER_REQUIRED

  SUBJECT_DRIFT_DETECTED:
    requiredDocuments:
      - agent-session-recovery-regulation
      - agents
    allowedActions:
      - freeze_new_subject
      - rerun_required_checks
      - invalidate_stale_verdicts
    forbiddenActions:
      - reuse_stale_review_verdict
      - reuse_stale_audit_verdict
      - resume_without_new_review
    expectedResults:
      - FREEZE_FOR_REVIEW

recoveryTransitions:
  ADVANCE_DISPATCHED_WORK:
    when: assignment dispatched and transport delivery does not prove admission or execution
    allowedActions:
      - inspect_session_state
      - verify_assignment_binding
      - verify_subject_sha
      - establish_admission_state
      - start_agent_if_authorized
      - process_available_results
      - perform_independent_coordination_work
      - record_pending_admission
      - reconcile_agent_session
    forbiddenActions:
      - passively_wait_for_notification
      - classify_delivered_as_running
      - classify_queued_as_admitted
      - promise_future_result
    resultsIn:
      - AGENT_RUNNING
      - AGENT_RESULT_RECEIVED
      - AGENT_SESSION_RECONCILE_REQUIRED
      - HUMAN_ACTION_REQUIRED
      - BLOCKED_EXTERNAL

  RESUME_ASSIGNMENT:
    when: assignment recovered, workspace binding valid, no unknown changes, no OWNER/HUMAN boundary
  FREEZE_FOR_REVIEW:
    when: implementation complete, exact subject determined, checks passed
  RECOVER_COORDINATION_STATE:
    when: missing assignment or stale operational state or unknown batch present but read-only analysis is safe
    allowedActions:
      - read_git_and_files
      - compute_digests
      - run_safe_checks
      - classify_working_tree_readonly
      - separate_independently_reviewable_subjects
      - create_exact_subject_review_assignment
      - create_read_only_classification_assignment
      - prepare_correction_plan_for_stale_state
      - restore_operational_coordination_state
    forbiddenActions:
      - modify_unknown_files
      - stage_unknown_files
      - commit_unknown_batch
      - delete_caches_without_proof
      - mix_unknown_batch_with_committed_review_subject
      - declare_ownership_without_evidence
    resultsIn:
      - FREEZE_FOR_REVIEW
      - PREPARE_CORRECTION
      - BLOCKED_EXTERNAL
  PREPARE_CORRECTION:
    when: mandatory source missing, event not in action map, document drift found
  BLOCKED_EXTERNAL:
    when: external Registry, provider, artifact or runner required
  HUMAN_ACTION_REQUIRED:
    when: credential, MFA, protected runner or physical action required
  OWNER_REQUIRED:
    when: new norm required, norm conflict, reserved decision
  PRESERVE_AND_STOP:
    when: invalid workspace binding, evidence damage risk, unknown staged changes, or real authority conflict
