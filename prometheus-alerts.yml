groups:
  - name: coord
    rules:
      - alert: CoordHeartbeatMissRate
        expr: sum(rate(coord_heartbeat_miss_total[5m])) / clamp_min(sum(rate(coord_heartbeat_received_total[5m])) + sum(rate(coord_heartbeat_miss_total[5m])), 0.000001) > 0.01
        for: 5m
        labels: {severity: warning}
      - alert: CoordSplitBrain
        expr: increase(coord_split_brain_events_total[5m]) > 0
        labels: {severity: critical}
      - alert: CoordStalls
        expr: increase(coord_stall_total[5m]) > 0
        labels: {severity: warning}
      - alert: CoordAckLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(coord_ack_latency_seconds_bucket[5m]))) > 5
        for: 5m
        labels: {severity: warning}
